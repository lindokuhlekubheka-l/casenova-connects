<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casenova Connects | Find SA Bursaries, Universities & Internships 2026</title>
<meta name="description" content="Search SA bursaries, universities, internships. Click and apply on official NSFAS, UP, TUT sites.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a1931;--gold:#ffc947;--bg:#f7f8fc;--text:#1a1a2e;--grey:#6b7280}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--text)}
header{background:white;padding:15px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.06);position:sticky;top:0;z-index:100}
header img{height:48px;width:auto}
header h1{margin:0;font-size:22px;font-weight:800;color:var(--navy)}
header h1 span{color:#ff6b35}
.search-wrap{max-width:900px;margin:30px auto;padding:0 20px}
.search-box{width:100%;padding:18px 20px;border:2px solid #e5e7eb;border-radius:14px;font-size:16px;outline:none;transition:.2s}
.search-box:focus{border-color:var(--navy);box-shadow:0 0 0 4px rgba(10,25,49,.1)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}
.filters button{padding:8px 16px;border:1px solid #e5e7eb;background:white;border-radius:20px;cursor:pointer;font-weight:600}
.filters button.active{background:var(--navy);color:white;border-color:var(--navy)}
.grid{max-width:1200px;margin:0 auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{background:white;padding:20px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.05);transition:.2s;border:1px solid #f3f4f6}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.08)}
.card h3{margin:0 0 8px;font-size:16px;line-height:1.3}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:8px}
.type-University{background:#dbeafe;color:#1e40af}.type-TVET{background:#dcfce7;color:#166534}.type-Bursary{background:#fef3c7;color:#92400e}
.meta{color:var(--grey);font-size:13px;margin:6px 0}
.desc{font-size:13px;color:#4b5563;margin:10px 0}
.card a{display:inline-block;margin-top:10px;background:var(--navy);color:white;padding:10px 18px;border-radius:10px;text-decoration:none;font-weight:700;font-size:13px}
.card a:hover{background:#142d5c}
.count{text-align:center;color:var(--grey);margin:10px;font-weight:600}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="Casenova Connects Logo" onerror="this.style.display='none'">
  <h1>Casenova <span>Connects</span></h1>
</header>

<div class="search-wrap">
  <input type="text" id="search" class="search-box" placeholder="Search universities, colleges, bursaries... Type and press ENTER 🔍" autofocus>
  <div class="filters">
    <button class="active" data-filter="All" onclick="setFilter('All')">All (101)</button>
    <button data-filter="University" onclick="setFilter('University')">Universities (26)</button>
    <button data-filter="TVET College" onclick="setFilter('TVET College')">TVET (50)</button>
    <button data-filter="Bursary" onclick="setFilter('Bursary')">Bursaries (25)</button>
  </div>
  <div class="count" id="count">Loading opportunities...</div>
</div>

<div class="grid" id="grid"></div>

<script src="data.js"></script>
<script>
let activeFilter = 'All';
const grid = document.getElementById('grid');
const searchInput = document.getElementById('search');
const countEl = document.getElementById('count');

function render(list){
  grid.innerHTML = '';
  countEl.textContent = `${list.length} opportunities found`;
  list.forEach(o=>{
    const card = document.createElement('div');
    card.className='card';
    card.innerHTML = `
      <span class="badge type-${o.type.split(' ')[0]}">${o.type}</span>
      <h3>${o.title}</h3>
      <div class="meta">🏫 ${o.provider} • 📍 ${o.province}</div>
      <div class="meta">📚 ${o.field} • ⏰ ${o.closing}</div>
      <div class="desc">${o.desc}</div>
      <a href="${o.link}" target="_blank" rel="noopener">Apply Now →</a>
    `;
    grid.appendChild(card);
  });
}

function filterOpportunities(){
  const q = searchInput.value.toLowerCase();
  let filtered = opportunities.filter(o=>{
    const matchesSearch = !q || `${o.title} ${o.provider} ${o.province} ${o.field} ${o.desc}`.toLowerCase().includes(q);
    const matchesType = activeFilter==='All' || o.type===activeFilter;
    return matchesSearch && matchesType;
  });
  render(filtered);
}

function setFilter(type){
  activeFilter=type;
  document.querySelectorAll('.filters button').forEach(b=>{
    b.classList.toggle('active', b.dataset.filter===type);
  });
  filterOpportunities();
}

// ENTER KEY SEARCH - THIS IS NEW
searchInput.addEventListener('keydown', function(e){
  if(e.key==='Enter'){
    e.preventDefault();
    filterOpportunities();
  }
});
// Live search while typing too
searchInput.addEventListener('input', filterOpportunities);

document.addEventListener('DOMContentLoaded', ()=>{
  if(typeof opportunities!=='undefined'){
    render(opportunities);
  } else {
    countEl.textContent='Error: data.js not loaded. Check data.js file.';
  }
});
</script>
</body>
</html>
