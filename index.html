<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Casenova Connects</title><script src="https://cdn.tailwindcss.com"></script><style>*{font-family:sans-serif}.view{position:fixed;inset:0;width:100%;height:100%;overflow-y:auto;transform:translateX(100%);transition:.45s;z-index:10;background:#f8fafc}.view.active{transform:translateX(0)}.drawer{position:fixed;inset:0;z-index:70;pointer-events:none}.drawer.open{pointer-events:auto}.drawer-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:.3s}.drawer.open .drawer-bg{opacity:1}.drawer-box{position:absolute;top:0;right:0;width:100%;max-width:520px;height:100%;background:#fff;transform:translateX(100%);transition:.45s;overflow-y:auto}.drawer.open .drawer-box{transform:translateX(0)}</style></head><body>
<div id="view-home" class="view active"><div class="min-h-screen flex flex-col items-center justify-center p-6 text-center"><h1 class="text-5xl font-extrabold">Your Future<br><span class="text-violet-600">Starts Here</span></h1><p class="mt-4 text-slate-600 max-w-xl">We help learners find Universities, TVET, Bursaries, Nursing & Internships — all in one place with official apply links.</p><div class="mt-8 flex gap-3"><button onclick="goTo('view-choose')" class="px-8 py-4 bg-slate-900 text-white rounded-2xl font-bold">Explore Opportunities →</button><button onclick="toggleModal('aps-modal')" class="px-6 py-4 bg-violet-100 text-violet-700 rounded-2xl font-bold">APS Calc</button></div></div></div>
<div id="view-choose" class="view"><div class="p-8 max-w-5xl mx-auto"><button onclick="goTo('view-home')" class="px-4 py-2 bg-white border rounded-xl font-bold mb-8">← Home</button><h2 class="text-4xl font-extrabold">Choose Your Path</h2><div class="mt-8 grid grid-cols-2 md:grid-cols-3 gap-4"><button onclick="openList('university')" class="p-6 bg-white border rounded-2xl text-left font-bold">🎓 Universities</button><button onclick="openList('tvet')" class="p-6 bg-white border rounded-2xl text-left font-bold">🏫 TVET</button><button onclick="openList('bursary')" class="p-6 bg-white border rounded-2xl text-left font-bold">💰 Bursaries</button><button onclick="openList('nursing')" class="p-6 bg-white border rounded-2xl text-left font-bold">🩺 Nursing</button><button onclick="openList('internship')" class="p-6 bg-white border rounded-2xl text-left font-bold">💼 Internships</button><button onclick="openList('seta')" class="p-6 bg-white border rounded-2xl text-left font-bold">⚡ SETA</button></div></div></div>
<div id="view-list" class="view"><div class="sticky top-0 bg-white border-b p-4 flex justify-between items-center"><div class="flex gap-3 items-center"><button onclick="goTo('view-choose')" class="px-3 py-2 bg-slate-900 text-white rounded-xl">←</button><div><h3 id="list-title" class="font-bold">List</h3><p id="list-count" class="text-xs">0</p></div></div><input id="search" oninput="renderList()" placeholder="Search..." class="px-4 py-2 bg-slate-100 rounded-xl text-sm"></div><div id="list-grid" class="p-6 grid grid-cols-1 md:grid-cols-3 gap-5 max-w-6xl mx-auto"></div></div>
<div id="drawer" class="drawer"><div class="drawer-bg" onclick="closeDrawer()"></div><div class="drawer-box p-7"><div class="flex justify-between mb-6"><span id="drawer-tag" class="px-3 py-1 bg-slate-900 text-white text-xs rounded-full">TAG</span><button onclick="closeDrawer()" class="w-8 h-8 bg-slate-100 rounded-full">✕</button></div><div id="drawer-content"></div><div id="drawer-footer" class="mt-6 pt-6 border-t"></div></div></div>
<div id="aps-modal" class="fixed inset-0 z-50 bg-black/60 hidden flex items-center justify-center p-4"><div class="bg-white rounded-3xl p-6 w-full max-w-sm"><div class="flex justify-between mb-4"><h3 class="font-extrabold">APS Calculator</h3><button onclick="toggleModal('aps-modal')">✕</button></div><div class="space-y-2"><input class="aps-mark w-full p-3 bg-slate-100 rounded-xl" type="number" placeholder="Subject 1 %"><input class="aps-mark w-full p-3 bg-slate-100 rounded-xl" type="number" placeholder="Subject 2 %"><input class="aps-mark w-full p-3 bg-slate-100 rounded-xl" type="number" placeholder="Subject 3 %"><input class="aps-mark w-full p-3 bg-slate-100 rounded-xl" type="number" placeholder="Subject 4 %"><input class="aps-mark w-full p-3 bg-slate-100 rounded-xl" type="number" placeholder="Subject 5 %"><input class="aps-mark w-full p-3 bg-slate-100 rounded-xl" type="number" placeholder="Subject 6 %"></div><div class="mt-4 p-4 bg-slate-900 text-white rounded-xl flex justify-between items-center"><div><div class="text-xs opacity-60">APS</div><div id="calculated-aps" class="text-2xl font-bold">0</div></div><button onclick="applyApsFilter()" class="px-4 py-2 bg-white text-black rounded-xl font-bold">Filter</button></div></div></div>
<script>
const dataset=[{name:"UCT",type:"university",province:"WC",minAps:30,status:"Open",description:"Africa's top university.",requirements:"Bachelor pass English 5 Maths 5",link:"https://www.uct.ac.za/apply"},{name:"Wits",type:"university",province:"Gauteng",minAps:34,status:"Open",description:"Engineering and Health leader.",requirements:"APS 34+ Maths 5",link:"https://www.wits.ac.za/apply/"},{name:"UP",type:"university",province:"Gauteng",minAps:30,status:"Open",description:"Vet and Engineering.",requirements:"APS 30+",link:"https://www.up.ac.za/apply"},{name:"UJ",type:"university",province:"Gauteng",minAps:26,status:"Open",description:"Tech and Business.",requirements:"APS 26+",link:"https://www.uj.ac.za/apply"},{name:"UNISA",type:"university",province:"National",minAps:20,status:"Open",description:"Distance learning.",requirements:"APS 20+",link:"https://www.unisa.ac.za/apply"},{name:"Tshwane South TVET",type:"college",province:"Gauteng",minAps:18,status:"Open",description:"NATED Engineering",requirements:"Grade 9",link:"https://www.tsc.edu.za"},{name:"False Bay TVET",type:"college",province:"WC",minAps:18,status:"Open",description:"Tourism and IT",requirements:"Grade 9",link:"https://www.falsebaycollege.co.za"},{name:"NSFAS",type:"bursary",province:"National",minAps:0,status:"Closing Soon",description:"Covers everything.",requirements:"Income <R350k",link:"https://www.nsfas.org.za"},{name:"Funza Lushaka",type:"bursary",province:"National",minAps:24,status:"Open",description:"Teaching bursary.",requirements:"Bachelor pass",link:"https://www.funzalushaka.doe.gov.za"},{name:"Gauteng Nursing",type:"nursing",province:"Gauteng",minAps:27,status:"Open",description:"4-year Diploma",requirements:"English 4 Life Sci 4",link:"https://nursingintake.gauteng.gov.za"},{name:"Capitec Learnership",type:"learnership",province:"National",minAps:20,status:"Open",description:"12-month paid.",requirements:"Grade 12",link:"https://www.capitecbank.co.za/careers/"},{name:"SAPS Traineeship",type:"learnership",province:"National",minAps:20,status:"Open",description:"Police training.",requirements:"Grade 12",link:"https://www.saps.gov.za/careers"},{name:"BANKSETA",type:"seta",province:"National",minAps:18,status:"Open",description:"Banking SETA",requirements:"Grade 12",link:"https://www.bankseta.org.za"}];
let currentCategory='',currentView='view-home',userApsScore=null;
function goTo(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');currentView=id}
function openList(cat){currentCategory=cat;document.getElementById('list-title').innerText=cat.toUpperCase();goTo('view-list');renderList()}
function renderList(){const grid=document.getElementById('list-grid');const q=(document.getElementById('search').value||'').toLowerCase();let items=dataset;if(currentCategory){items=items.filter(i=>{if(currentCategory==='university')return i.type==='university';if(currentCategory==='tvet')return i.type==='college';if(currentCategory==='bursary')return i.type==='bursary';if(currentCategory==='nursing')return i.type==='nursing';if(currentCategory==='internship')return i.type==='internship';if(currentCategory==='seta')return i.type==='seta'||i.type==='learnership';return true})}if(q)items=items.filter(i=>i.name.toLowerCase().includes(q));if(userApsScore!==null)items=items.filter(i=>i.minAps<=userApsScore);document.getElementById('list-count').innerText=items.length+' opportunities';grid.innerHTML=items.map(it=>`<div onclick="openDrawer(${dataset.indexOf(it)})" class="bg-white border rounded-2xl p-5 cursor-pointer hover:shadow-lg"><span class="text-[10px] px-2 py-1 bg-slate-100 rounded-full uppercase font-bold">${it.type}</span><h4 class="font-bold mt-2">${it.name}</h4><p class="text-xs text-slate-500">${it.description}</p><div class="mt-2 text-xs flex justify-between"><span>${it.province} • APS ${it.minAps}</span><span>View →</span></div></div>`).join('')}
function openDrawer(i){const it=dataset[i];document.getElementById('drawer-tag').innerText=it.type;document.getElementById('drawer-content').innerHTML=`<h2 class="text-2xl font-extrabold">${it.name}</h2><div class="mt-4 p-4 bg-slate-50 rounded-xl"><b class="text-xs">REQUIREMENTS</b><div class="text-sm mt-1">${it.requirements}</div></div>`;document.getElementById('drawer-footer').innerHTML=`<a href="${it.link}" target="_blank" class="block w-full text-center py-4 bg-slate-900 text-white rounded-xl font-bold">Apply Officially 🚀</a>`;document.getElementById('drawer').classList.add('open')}
function closeDrawer(){document.getElementById('drawer').classList.remove('open')}
function toggleModal(id){document.getElementById(id).classList.toggle('hidden')}
function calculateAPS(){let t=0;document.querySelectorAll('.aps-mark').forEach(inp=>{let v=parseFloat(inp.value)||0;if(v>=80)t+=7;else if(v>=70)t+=6;else if(v>=60)t+=5;else if(v>=50)t+=4;else if(v>=40)t+=3;else if(v>=30)t+=2;else if(v>0)t+=1});document.getElementById('calculated-aps').innerText=t;return t}
document.addEventListener('input',e=>{if(e.target.classList.contains('aps-mark'))calculateAPS()});
function applyApsFilter(){userApsScore=calculateAPS();toggleModal('aps-modal');goTo('view-list');renderList()}
</script></body></html>
